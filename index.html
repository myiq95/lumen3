          overflow: hidden !important;
          position: fixed;
          width: 100%;
          height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F5F1E8; }
        ::-webkit-scrollbar-thumb { background: #D4C4A8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #C8A96E; }

        /* Library */
        .library-container {
          min-height: 100vh;
          background: #FFFEFB;
          padding-bottom: 100px;
        }

        .library-header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: rgba(255,254,251,0.92);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border-bottom: 1px solid #F0E9DB;
        }

        .library-header-inner {
          max-width: 1100px;
          margin: 0 auto;
          padding: 16px 24px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 14px;
        }

        .brand-mark {
          width: 40px;
          height: 40px;
          background: #1A1612;
          color: #FFFEFB;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Fraunces', serif;
          font-weight: 600;
          font-size: 22px;
          border-radius: 8px;
          letter-spacing: -0.02em;
        }

        .brand-text { display: flex; flex-direction: column; gap: 2px; }
        .brand-title {
          margin: 0;
          font-family: 'Fraunces', serif;
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.08em;
          color: #1A1612;
          line-height: 1;
        }
        .brand-sub {
          font-size: 11px;
          letter-spacing: 0.08em;
          color: #8C7F6B;
          text-transform: uppercase;
        }

        .header-file-btn {
          appearance: none;
          border: 1px solid #1A1612;
          background: #1A1612;
          color: #FFFEFB;
          padding: 10px 18px;
          border-radius: 999px;
          font-family: 'Noto Serif KR', serif;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.02em;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 8px;
          transition: all 0.2s ease;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
        }
        .header-file-btn:hover { background: #2B241E; transform: translateY(-1px); }
        .header-file-btn:active { transform: translateY(0px) scale(0.98); }
        .header-file-btn.small { padding: 8px 14px; font-size: 12px; }
        .btn-icon { font-size: 14px; }

        .library-content {
          max-width: 1100px;
          margin: 0 auto;
          padding: 40px 24px 0;
        }

        .library-intro { margin-bottom: 48px; }
        .library-title {
          margin: 0 0 12px;
          font-family: 'Fraunces', serif;
          font-size: 38px;
          font-weight: 600;
          letter-spacing: -0.02em;
          color: #1A1612;
          line-height: 1.15;
        }
        .library-desc {
          margin: 0 0 24px;
          font-size: 15px;
          line-height: 1.7;
          color: #6B5F4F;
          max-width: 520px;
        }

        .search-box {
          position: relative;
          max-width: 420px;
        }
        .search-input {
          width: 100%;
          padding: 12px 16px 12px 40px;
          border: 1px solid #E8DDC7;
          border-radius: 12px;
          background: #F5F1E8;
          font-family: 'Noto Serif KR', serif;
          font-size: 14px;
          color: #1A1612;
          outline: none;
          transition: all 0.2s;
        }
        .search-input:focus { border-color: #C8A96E; background: #FFFEFB; }
        .search-icon {
          position: absolute;
          left: 14px;
          top: 50%;
          transform: translateY(-50%);
          color: #8C7F6B;
          font-size: 16px;
        }

        /* Empty state */
        .empty-state {
          text-align: center;
          padding: 40px 20px 80px;
          max-width: 560px;
          margin: 0 auto;
        }

        .empty-illustration {
          position: relative;
          width: 120px;
          height: 120px;
          margin: 0 auto 32px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .empty-book-stack {
          display: flex;
          gap: 6px;
          transform: rotate(-8deg);
        }

        .book-spine {
          width: 28px;
          height: 88px;
          border-radius: 4px;
          background: #F5F1E8;
          border: 1px solid #E8DDC7;
          position: relative;
        }
        .spine-1 { background: #1A1612; transform: rotate(2deg); }
        .spine-2 { background: #C8A96E; transform: rotate(-1deg); margin-top: 6px; }
        .spine-3 { background: #F5F1E8; transform: rotate(1deg); margin-top: -4px; }

        .empty-glow {
          position: absolute;
          inset: -20px;
          background: radial-gradient(ellipse at center, rgba(200,169,110,0.15) 0%, transparent 70%);
          pointer-events: none;
        }

        .empty-title {
          margin: 0 0 12px;
          font-family: 'Fraunces', serif;
          font-size: 26px;
          font-weight: 600;
          color: #1A1612;
        }
        .empty-desc {
          margin: 0 0 32px;
          font-size: 14px;
          line-height: 1.7;
          color: #8C7F6B;
        }

        .empty-file-btn {
          appearance: none;
          border: none;
          background: #1A1612;
          color: #FFFEFB;
          padding: 18px 28px;
          border-radius: 16px;
          font-family: 'Fraunces', serif;
          font-size: 17px;
          font-weight: 600;
          cursor: pointer;
          display: inline-flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          transition: all 0.2s ease;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          box-shadow: 0 8px 24px rgba(26,22,18,0.18);
          min-width: 200px;
          user-select: none;
        }
        .empty-file-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(26,22,18,0.22); }
        .empty-file-btn:active { transform: translateY(0px) scale(0.98); }
        .btn-sub {
          font-family: 'Noto Serif KR', serif;
          font-size: 11px;
          font-weight: 400;
          opacity: 0.7;
          letter-spacing: 0.04em;
        }

        .empty-tips {
          margin-top: 48px;
          display: flex;
          flex-direction: column;
          gap: 12px;
          text-align: left;
          background: #F5F1E8;
          border-radius: 16px;
          padding: 20px;
        }
        .tip {
          display: flex;
          gap: 12px;
          font-size: 13px;
          line-height: 1.6;
          color: #6B5F4F;
        }
        .tip-icon { color: #C8A96E; flex-shrink: 0; }

        .ios-notice {
          margin-top: 24px;
          background: #FFF4E0;
          border: 1px solid #F5D9A0;
          border-radius: 12px;
          padding: 14px 16px;
          text-align: left;
        }
        .ios-badge {
          display: inline-block;
          background: #1A1612;
          color: #FFFEFB;
          font-size: 10px;
          letter-spacing: 0.08em;
          padding: 3px 8px;
          border-radius: 999px;
          margin-bottom: 8px;
          font-family: 'Fraunces', serif;
        }
        .ios-notice p {
          margin: 0;
          font-size: 12px;
          line-height: 1.6;
          color: #6B5F4F;
        }

        /* Book grid */
        .book-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
          gap: 18px;
        }

        .book-card {
          background: #F5F1E8;
          border: 1px solid #E8DDC7;
          border-radius: 16px;
          padding: 20px;
          cursor: pointer;
          transition: all 0.2s ease;
        }
        .book-card:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 24px rgba(26,22,18,0.08);
          border-color: #D4C4A8;
          background: #FFFEFB;
        }
        .book-card-inner { display: flex; flex-direction: column; gap: 8px; }
        .book-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .book-card-mark {
          width: 28px;
          height: 28px;
          background: #1A1612;
          color: #FFFEFB;
          border-radius: 6px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Fraunces', serif;
          font-size: 14px;
          font-weight: 600;
        }
        .book-delete {
          appearance: none;
          border: none;
          background: transparent;
          color: #8C7F6B;
          font-size: 20px;
          cursor: pointer;
          padding: 0 4px;
          line-height: 1;
          border-radius: 4px;
        }
        .book-delete:hover { color: #1A1612; background: #E8DDC7; }
        .book-card-title {
          margin: 4px 0 0;
          font-family: 'Fraunces', serif;
          font-size: 18px;
          font-weight: 600;
          line-height: 1.3;
          color: #1A1612;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .book-card-author {
          margin: 0;
          font-size: 13px;
          color: #8C7F6B;
        }
        .book-card-meta {
          display: flex;
          gap: 6px;
          font-size: 11px;
          color: #8C7F6B;
          margin-top: 4px;
        }
        .book-card-progress {
          margin-top: 12px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .progress-bar {
          flex: 1;
          height: 4px;
          background: #E8DDC7;
          border-radius: 2px;
          overflow: hidden;
        }
        .progress-fill {
          height: 100%;
          background: #C8A96E;
          border-radius: 2px;
          transition: width 0.3s;
        }
        .progress-text { font-size: 11px; color: #8C7F6B; }

        .library-footer {
          margin-top: 80px;
          padding-top: 24px;
          border-top: 1px solid #F0E9DB;
          text-align: center;
        }
        .library-footer p {
          margin: 0;
          font-size: 12px;
          color: #8C7F6B;
          line-height: 1.6;
        }
        .footer-sub { margin-top: 4px !important; opacity: 0.7; }

        /* Reader */
        .reader-container {
          min-height: 100vh;
          background: #FFFEFB;
          padding-bottom: 100px;
        }

        .reader-header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: rgba(255,254,251,0.92);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border-bottom: 1px solid #F0E9DB;
        }

        .reader-header-inner {
          max-width: 720px;
          margin: 0 auto;
          padding: 14px 24px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }

        .icon-btn {
          appearance: none;
          border: 1px solid #E8DDC7;
          background: #F5F1E8;
          color: #1A1612;
          padding: 8px 14px;
          border-radius: 999px;
          font-family: 'Noto Serif KR', serif;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.2s;
          flex-shrink: 0;
        }
        .icon-btn:hover { background: #FFFEFB; border-color: #D4C4A8; }

        .reader-header-center {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
          gap: 2px;
          overflow: hidden;
        }
        .reader-book-title {
          font-family: 'Fraunces', serif;
          font-size: 14px;
          font-weight: 600;
          color: #1A1612;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .reader-chapter-title {
          font-size: 11px;
          color: #8C7F6B;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .book-article {
          max-width: 600px;
          margin: 0 auto;
          padding: 48px 24px 0;
        }

        .book-meta-header {
          text-align: center;
          margin-bottom: 56px;
        }
        .meta-top {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin-bottom: 20px;
        }
        .meta-author {
          font-size: 13px;
          letter-spacing: 0.06em;
          color: #8C7F6B;
          text-transform: uppercase;
        }
        .meta-dot { color: #D4C4A8; font-size: 10px; }
        .meta-chapter-count {
          font-size: 12px;
          color: #8C7F6B;
        }

        .book-title-main {
          margin: 0 0 12px;
          font-family: 'Fraunces', serif;
          font-size: 38px;
          font-weight: 600;
          line-height: 1.15;
          letter-spacing: -0.02em;
          color: #1A1612;
        }

        .book-chapter-main {
          margin: 0 0 32px;
          font-family: 'Fraunces', serif;
          font-size: 22px;
          font-weight: 600;
          color: #6B5F4F;
          line-height: 1.3;
        }

        .meta-divider, .chapter-divider-gold, .footer-divider {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          margin: 24px 0;
        }
        .gold-line {
          height: 1px;
          width: 48px;
          background: linear-gradient(to right, transparent, #C8A96E, transparent);
          flex-shrink: 0;
        }
        .gold-dot {
          width: 6px;
          height: 6px;
          background: #C8A96E;
          border-radius: 50%;
          flex-shrink: 0;
          box-shadow: 0 0 0 4px rgba(200,169,110,0.15);
        }

        .chapter-header-block {
          margin: 48px 0 32px;
          text-align: center;
        }
        .chapter-title-gold {
          margin: 16px 0;
          font-family: 'Fraunces', serif;
          font-size: 26px;
          font-weight: 600;
          color: #1A1612;
          line-height: 1.3;
        }

        .book-content {
          font-size: 18px;
          line-height: 1.9;
          color: #2B241E;
        }

        .book-paragraph {
          margin: 0 0 1.7em 0;
          text-align: justify;
          hanging-punctuation: first;
          word-break: keep-all;
          overflow-wrap: break-word;
        }

        .book-paragraph.first-para::first-letter {
          /* Fallback, actual drop-cap is span */
        }

        .drop-cap {
          float: left;
          font-family: 'Fraunces', serif;
          font-size: 54px;
          font-weight: 600;
          line-height: 0.85;
          color: #C8A96E;
          margin: 6px 10px 0 0;
          padding-top: 4px;
        }

        .dialogue-para {
          position: relative;
          padding-left: 20px;
          border-left: 2px solid #E8DDC7;
          margin-left: 8px;
          color: #3A332B;
          background: linear-gradient(to right, rgba(245,241,232,0.6), transparent);
        }
        .dialogue-para::before {
          content: '';
          position: absolute;
          left: -2px;
          top: 0;
          bottom: 0;
          width: 2px;
          background: linear-gradient(to bottom, #C8A96E, #E8DDC7);
        }

        .short-para {
          text-align: center;
          font-style: italic;
          color: #8C7F6B;
          margin: 2em 0 !important;
        }

        .book-footer {
          margin-top: 80px;
          padding-bottom: 40px;
          text-align: center;
        }

        .chapter-nav {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          background: #F5F1E8;
          border: 1px solid #E8DDC7;
          border-radius: 12px;
          padding: 14px 18px;
          margin: 32px 0;
        }

        .nav-btn {
          appearance: none;
          border: none;
          background: #1A1612;
          color: #FFFEFB;
          padding: 8px 16px;
          border-radius: 999px;
          font-family: 'Noto Serif KR', serif;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.2s;
        }
        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .nav-btn:not(:disabled):hover { background: #2B241E; transform: translateY(-1px); }
        .nav-info { font-size: 12px; color: #8C7F6B; }

        .book-end-mark {
          margin: 40px 0 0;
          font-size: 24px;
          color: #C8A96E;
          letter-spacing: 0.2em;
        }

        /* Bottom Island - 4 buttons with touchEnd direct */
        .bottom-island {
          position: fixed;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 200;
          background: rgba(26,22,18,0.94);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-radius: 999px;
          padding: 8px;
          display: flex;
          gap: 6px;
          box-shadow: 0 12px 32px rgba(26,22,18,0.28), 0 0 0 1px rgba(255,254,251,0.08) inset;
        }

        .island-btn {
          appearance: none;
          border: none;
          background: transparent;
          color: #FFFEFB;
          padding: 10px 14px;
          border-radius: 999px;
          font-family: 'Noto Serif KR', serif;
          font-size: 12px;
          font-weight: 500;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          min-width: 64px;
          transition: all 0.2s ease;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
        }
        .island-btn:hover { background: rgba(255,254,251,0.12); }
        .island-btn:active { background: rgba(255,254,251,0.18); transform: scale(0.96); }
        .island-btn.active { background: #FFFEFB; color: #1A1612; }
        .island-icon { font-size: 18px; line-height: 1; }
        .island-label { font-size: 10px; letter-spacing: 0.02em; opacity: 0.9; }
        .island-btn.primary {
          background: #FFFEFB;
          color: #1A1612;
          box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .island-btn.primary:hover { background: #FFFFFF; transform: translateY(-1px); }

        /* TOC Modal */
        .modal-overlay {
          position: fixed;
          inset: 0;
          z-index: 300;
          background: rgba(26,22,18,0.48);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          display: flex;
          align-items: flex-end;
          justify-content: center;
          padding: 20px;
        }

        .toc-modal {
          background: #FFFEFB;
          border-radius: 20px 20px 0 0;
          width: 100%;
          max-width: 520px;
          max-height: 82vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 -12px 40px rgba(26,22,18,0.18);
          animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
          from { transform: translateY(100%); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }

        .toc-header {
          padding: 20px 20px 16px;
          border-bottom: 1px solid #F0E9DB;
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-shrink: 0;
        }
        .toc-title {
          margin: 0;
          font-family: 'Fraunces', serif;
          font-size: 20px;
          font-weight: 600;
          color: #1A1612;
        }
        .toc-close {
          appearance: none;
          border: 1px solid #E8DDC7;
          background: #F5F1E8;
          width: 32px;
          height: 32px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: #6B5F4F;
        }

        .toc-list {
          overflow-y: auto;
          padding: 8px 0 20px;
          flex: 1;
        }

        .toc-item {
          padding: 14px 20px;
          display: flex;
          gap: 14px;
          cursor: pointer;
          transition: background 0.15s;
          border-left: 3px solid transparent;
        }
        .toc-item:hover { background: #F5F1E8; }
        .toc-item.active { background: #F5F1E8; border-left-color: #C8A96E; }
        .toc-item-index {
          font-family: 'Fraunces', serif;
          font-size: 12px;
          color: #C8A96E;
          font-weight: 600;
          min-width: 28px;
          padding-top: 2px;
        }
        .toc-item-title {
          font-size: 14px;
          line-height: 1.5;
          color: #2B241E;
          flex: 1;
        }
        .toc-item.active .toc-item-title { color: #1A1612; font-weight: 600; }

        /* Paste Modal */
        .paste-modal {
          background: #FFFEFB;
          border-radius: 20px;
          width: 100%;
          max-width: 560px;
          max-height: 86vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 20px 60px rgba(26,22,18,0.24);
          animation: scaleIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
          from { transform: scale(0.94); opacity: 0; }
          to { transform: scale(1); opacity: 1; }
        }

        .paste-header {
          padding: 20px 20px 16px;
          border-bottom: 1px solid #F0E9DB;
        }
        .paste-title {
          margin: 0 0 4px;
          font-family: 'Fraunces', serif;
          font-size: 20px;
          font-weight: 600;
        }
        .paste-sub { margin: 0; font-size: 13px; color: #8C7F6B; }

        .paste-body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }

        .paste-label { font-size: 12px; font-weight: 600; color: #6B5F4F; letter-spacing: 0.04em; text-transform: uppercase; }

        .paste-input, .paste-textarea {
          width: 100%;
          border: 1px solid #E8DDC7;
          border-radius: 12px;
          background: #F5F1E8;
          padding: 12px 14px;
          font-family: 'Noto Serif KR', serif;
          font-size: 14px;
          color: #1A1612;
          outline: none;
        }
        .paste-input:focus, .paste-textarea:focus { border-color: #C8A96E; background: #FFFEFB; }
        .paste-textarea { min-height: 220px; resize: vertical; line-height: 1.7; }

        .paste-footer {
          padding: 16px 20px;
          border-top: 1px solid #F0E9DB;
          display: flex;
          gap: 10px;
          justify-content: flex-end;
        }

        .paste-cancel, .paste-submit {
          appearance: none;
          border-radius: 999px;
          padding: 10px 18px;
          font-family: 'Noto Serif KR', serif;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }
        .paste-cancel { border: 1px solid #E8DDC7; background: #FFFEFB; color: #6B5F4F; }
        .paste-cancel:hover { background: #F5F1E8; }
        .paste-submit { border: 1px solid #1A1612; background: #1A1612; color: #FFFEFB; }
        .paste-submit:hover { background: #2B241E; }

        /* Toasts - iOS debug */
        .toast-container {
          position: fixed;
          top: 20px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 500;
          display: flex;
          flex-direction: column;
          gap: 8px;
          align-items: center;
          pointer-events: none;
          width: calc(100% - 40px);
          max-width: 400px;
        }

        .toast {
          background: #1A1612;
          color: #FFFEFB;
          padding: 10px 16px;
          border-radius: 999px;
          font-size: 12px;
          font-family: 'Noto Serif KR', serif;
          box-shadow: 0 8px 24px rgba(0,0,0,0.18);
          animation: toastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
          pointer-events: auto;
          display: flex;
          align-items: center;
          gap: 8px;
          max-width: 100%;
        }
        .toast.debug { background: #2B241E; border: 1px solid #C8A96E; }
        .toast.success { background: #1A1612; }
        .toast.error { background: #8B2C2C; }
        .toast.info { background: #3A332B; }

        @keyframes toastIn {
          from { transform: translateY(-12px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }

        /* Processing overlay */
        .processing-overlay {
          position: fixed;
          inset: 0;
          z-index: 400;
          background: rgba(255,254,251,0.88);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
        }
        .processing-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #F0E9DB;
          border-top-color: #C8A96E;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .processing-text {
          font-family: 'Fraunces', serif;
          font-size: 16px;
          font-weight: 600;
          color: #1A1612;
        }
        .processing-sub { font-size: 13px; color: #8C7F6B; }

        /* Responsive */
        @media (max-width: 720px) {
          .library-header-inner, .library-content { padding-left: 16px; padding-right: 16px; }
          .library-title { font-size: 32px; }
          .book-article { padding-left: 16px; padding-right: 16px; }
          .book-title-main { font-size: 32px; }
          .bottom-island { bottom: 12px; padding: 6px; }
          .island-btn { min-width: 56px; padding: 8px 10px; }
          .island-icon { font-size: 16px; }
          .island-label { font-size: 9px; }
          .reader-header-inner { padding-left: 16px; padding-right: 16px; }
          .book-grid { grid-template-columns: 1fr; }
        }

        /* Focus visible for a11y */
        button:focus-visible, input:focus-visible, textarea:focus-visible {
          outline: 2px solid #C8A96E;
          outline-offset: 2px;
        }

        /* Selection */
        ::selection { background: rgba(200,169,110,0.28); }
