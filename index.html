비가 오는 날, 첫 손님이 들어왔다. 그는 우산을 털며 말했다. "여기 따뜻한 차가 있나요?"

"엄마, 왜 여기에 가게를 차렸어?"
"네가 돌아올 자리를 만들고 싶어서."

눈이 내리기 시작했다. 약속은 눈처럼 조용히 쌓였다.

프롤로그 같은 하루였다.

바람이 매서웠다.

꽃봉오리가 맺혔다.

제10장
어머니는 편지를 꺼냈다.

제11장
"이제 가야 할 시간이다."

교실은 비어 있었다.

서문처럼 시작된 이야기가...

외전 - 잃어버린 시간

작가 후기

모든 것이 제자리로 돌아왔다.
