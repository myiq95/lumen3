윤서하

제1장 서막

바람은 차갑게 불고 있었다. 성벽 위에서 내려다본 도시는 안개에 잠겨 있었고, 멀리서 종소리가 울려 퍼졌다. 그녀는 손에 낡은 책을 꼭 쥐고 있었다. 표지에는 아무 글자도 없었지만, 손끝에서 따뜻한 기운이 느껴졌다.

"왜 여기에 있는 거죠?" 그녀가 물었다.

남자는 고개를 들지 않았다. 그의 어깨는 축 처져 있었고, 목소리는 바람에 흩어졌다.

"기다리고 있었어. 네가 올 줄 알았거든."

그녀는 한 걸음 다가갔다. 발밑의 낙엽이 바스락거렸다. 이 계절에 이렇게 많은 낙엽이 쌓인 것은 처음이었다. 마치 누군가 일부러 길을 덮어 놓은 것 같았다.

"이 책, 당신 것인가요?"

남자는 그제야 고개를 들었다. 그의 눈은 깊었고, 어딘가 슬픔이 서려 있었다.

제2장 재회

도서관의 문을 열자 먼지 냄새가 코를 찔렀다. 그녀는 오래된 램프에 불을 붙였다. 노란 불빛이 서가를 따라 길게 늘어졌다. 책들은 모두 제자리를 지키고 있었다. 마치 그녀를 기다리고 있었던 것처럼.

"여기는 변한 게 없네."

그녀는 속삭였다. 손가락으로 책등을 쓸어내렸다. 먼지가 손끝에 묻어났다. 가장 안쪽 서가, 그곳에 그 책이 있어야 했다. 세 번을 찾았지만 보이지 않았다.

그때였다. 뒤에서 발소리가 들렸다.

"찾는 게 있어?"

돌아보니 남자가 서 있었다. 서막에서 만났던 그 남자였다. 이제는 외투를 벗은 모습이었다. 셔츠 소매가 팔꿈치까지 걷어 올려져 있었고, 손에는 같은 책이 들려 있었다.

"그건 내 거예요."

그녀는 손을 내밀었다. 남자는 잠시 망설이다 책을 건네주었다. 책은 여전히 따뜻했다.

"네가 떠난 뒤로, 아무도 이 방에 들어오지 않았어."

그의 목소리는 낮았다. 그녀는 책을 펼쳤다. 첫 장에는 낯익은 글씨체가 있었다.

제3장 진실

비가 내리기 시작했다. 창문을 두드리는 빗소리가 규칙적으로 울렸다. 그녀는 책상 앞에 앉아 책을 읽기 시작했다. 문장 하나하나가 기억을 건드렸다. 어릴 적 여름, 할머니의 무릎에서 들었던 이야기. 숲속의 집, 잃어버린 열쇠, 그리고 약속.

"기억나? 네가 했던 약속."

남자가 물었다. 그는 창가에 기대어 서 있었다. 빗물이 유리를 타고 흘러내렸다.

"약속이라니요. 무슨..."

"열 살 때. 네가 이 도서관을 지키겠다고 했잖아. 나랑 같이."

그녀는 입술을 깨물었다. 기억이 조각나 있었다. 하지만 무언가 뜨거운 것이 가슴에서 올라왔다. 그녀는 고개를 끄덕였다. 눈물이 핑 돌았다.

"기억났어요. 그런데 당신은 왜 떠난 거예요?"

남자는 웃었다. 처음으로 웃는 얼굴이었다.

"떠난 게 아니야. 기다린 거지. 네가 돌아올 때까지."

책의 마지막 장에는 흰 페이지 하나만 남아 있었다. 그녀는 펜을 들었다. 그리고 천천히 글을 쓰기 시작했다. 바깥에서는 비가 그치고, 안개가 걷히고 있었다.

제4장 에필로그

아침이 밝았다. 도서관의 문이 열리고, 아이들의 웃음소리가 들려왔다. 그녀는 새로 쓴 페이지를 책에 끼워 넣었다. 이제 이 책은 완전해졌다. 남자는 더 이상 그곳에 없었지만, 그의 자리는 따뜻하게 남아 있었다.
